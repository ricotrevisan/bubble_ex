name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - elixir: "1.17"
            otp: "27"
          - elixir: "1.18.4"
            otp: "28.0"
          - elixir: "1.20.2"
            otp: "28.1.1"
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-
      - run: mix deps.get
      - run: mix quality
      - name: Check the production package from a fresh consumer
        if: matrix.elixir == '1.18.4' && matrix.otp == '28.0'
        run: scripts/package_consumer_smoke.sh

  ash-compile-check:
    # Renders every fixture through BubbleEx.Target.Ash, compiles the source in
    # a scratch project pinned to Target.Ash.versions/0, checks the generated
    # migrations, runs them and round-trips sample rows through every
    # resource. See scripts/ash_compile_check.sh. Its PostgreSQL service also
    # loads the Db.Sql.Postgres DDL of every fixture (DbDdlTest). Elixir 1.20
    # runs too: its type checker warns on generated code that 1.18 accepts
    # (WTF-394), and the scratch project compiles with --warnings-as-errors.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - elixir: "1.18.4"
            otp: "28.0"
          - elixir: "1.20.2"
            otp: "28.1.1"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ASH_COMPILE_CHECK_DB: ecto://postgres:postgres@localhost:5432
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-ash-check-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock', 'scripts/ash_compile_check/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-ash-check-${{ matrix.elixir }}-${{ matrix.otp }}-
      - run: mix deps.get
      - run: scripts/ash_compile_check.sh
      - name: Load the generated PostgreSQL DDL of every schema fixture
        if: matrix.elixir == '1.18.4'
        run: |
          command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
          mix test --only ddl_postgres
        env:
          MIX_ENV: test
          BUBBLE_EX_DDL_PG: postgres://postgres:postgres@localhost:5432

  phoenix-compile-check:
    # Renders every fixture through BubbleEx.Target.Phoenix as a complete
    # Phoenix/Ash application (one scratch project; the dependencies,
    # locked by scripts/phoenix_compile_check/mix.lock, compile once), then
    # per fixture: mix compile --warnings-as-errors, mix ash.codegen and
    # ash.codegen --check, and mix test (the scaffolded smoke test boots the
    # endpoint and signs a user in with a magic link). See
    # scripts/phoenix_compile_check.sh.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - elixir: "1.18.4"
            otp: "28.0"
          - elixir: "1.20.2"
            otp: "28.1.1"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PHOENIX_COMPILE_CHECK_DB: ecto://postgres:postgres@localhost:5432
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-phoenix-check-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock', 'scripts/phoenix_compile_check/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-phoenix-check-${{ matrix.elixir }}-${{ matrix.otp }}-
      - run: mix deps.get
      - run: scripts/phoenix_compile_check.sh

  fidelity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "27"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-fidelity-${{ hashFiles('**/mix.lock') }}
      - run: mix deps.get
      - name: Install pinned Playwright
        working-directory: test/support/fidelity
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Install optional snapshot parsers and pinned browser API
        run: |
          mkdir -p _build/snapshot-runtime
          cp lib/bubble_ex/frontend/snapshot/runtime/package*.json _build/snapshot-runtime/
          npm ci --ignore-scripts --prefix _build/snapshot-runtime
      - run: mix test --only fidelity
        env:
          MIX_ENV: test
