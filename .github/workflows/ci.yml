name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - elixir: "1.17"
            otp: "27"
          - elixir: "1.18.4"
            otp: "28.0"
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-
      - run: mix deps.get
      - run: mix quality
      - name: Check the production package from a fresh consumer
        if: matrix.elixir == '1.18.4' && matrix.otp == '28.0'
        run: scripts/package_consumer_smoke.sh

  fidelity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "27"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-fidelity-${{ hashFiles('**/mix.lock') }}
      - run: mix deps.get
      - name: Install pinned Playwright
        working-directory: test/support/fidelity
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - run: mix test --only fidelity
        env:
          MIX_ENV: test
